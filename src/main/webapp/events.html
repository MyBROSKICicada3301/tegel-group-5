            .event-title {

<!-- Admin-only event creation modal -->
<div class="modal fade" id="createEventModal" tabindex="-1" aria-labelledby="createEventModalLabel"
     aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-orange text-white">
                <h5 class="modal-title" id="createEventModalLabel">Create New Event</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="eventCreateForm" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="eventTitle" class="form-label">Title</label>
                        <input type="text" class="form-control" id="eventTitle" name="title"
                               required>
                    </div>
                    <div class="mb-3">
                        <label for="eventDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="eventDescription" name="description"
                                  rows="3" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="eventDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="eventDate" name="date"
                                   required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="maxParticipants" class="form-label">Maximum
                                Participants</label>
                            <input type="number" class="form-control" id="maxParticipants"
                                   name="maxParticipants"
                                   value="50" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="eventLocation" class="form-label">Location</label>
                        <input type="text" class="form-control" id="eventLocation" name="location"
                               value="Tegel Community Center" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="eventPrice" class="form-label">Event Price (€)</label>
                            <input type="number" class="form-control" id="eventPrice" name="price"
                                   min="0" step="0.01" value="0.00">
                            <small class="form-text text-muted">Set to 0 for free events</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="eventImage" class="form-label">Event Image</label>
                            <input type="file" class="form-control" id="eventImage"
                                   name="eventImage" accept="image/*">
                            <small class="form-text text-muted">Upload an image (max 10MB)</small>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="hasFoodOption"
                                       name="hasFoodOption">
                                <label class="form-check-label" for="hasFoodOption">
                                    Food options available
                                </label>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isPublic"
                                       name="isPublic" checked>
                                <label class="form-check-label" for="isPublic">
                                    Public event
                                </label>
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isActive"
                                       name="isActive" checked>
                                <label class="form-check-label" for="isActive">
                                    Active event
                                </label>
                            </div>
                        </div>
                    </div>
                    <div id="adminEventCreateMsg" class="mt-2"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel

<!-- Script section -->
<script>
    function loadEvents() {
        console.log('Loading events from server...');
        fetch('/tegel_webapp/events')
            .then(response => {
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                return response.text(); // Get response as text first for debugging
            })
            .then(text => {
                console.log('Raw response:', text);
                try {
                    const events = JSON.parse(text);
                    console.log('Parsed events:', events);
                    if (!Array.isArray(events)) {
                        console.error('Events is not an array:', events);
                        throw new Error('Expected array of events');
                    }
                    displayEvents(events);
                } catch (e) {
                    console.error('JSON parse error:', e);
                    console.log('Showing empty events list due to error');
                    displayEvents([]);  // Display empty array instead of dummy events
                }
            })
            .catch(error => {
                console.error('Error loading events from server:', error);
                // Show empty state instead of dummy data
                console.log('Showing empty events list due to server error');
                displayEvents([]);
            });
    }

    // Store the current events that are displayed
    let currentEvents = [];

    // Update displayEvents to store the events in currentEvents
    function displayEvents(events) {
        currentEvents = events; // Store the events for search functionality
        const container = document.getElementById('eventsContainer');
        container.innerHTML = '';

        if (events.length === 0) {
            container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="alert alert-orange" style="background-color: #fff3e6; color: #de5f00; border-color: #ffccaa;">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            No events available at this time.
                        </div>
                        <p>Check back later or try a different search.</p>
                    </div>`;
            return;
        }

        events.forEach(event => {
            // Format date for display
            let displayDate = event.date;
            if (event.date) {
                const eventDate = new Date(event.date);
                displayDate = eventDate.toLocaleDateString('en-US', {
                    weekday: 'short',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            }

            // Determine the image source
            let imageHtml = '';
            if (event.imageId) {
                imageHtml = `
                        <div class="card-img-top-container">
                            <img src="/tegel_webapp/get-image?id=${event.imageId}"
                                 class="card-img-top event-image" alt="${event.title}">
                        </div>`;
            } else if (event.image) {
                const imageId = parseInt(event.image);
                if (!isNaN(imageId)) {
                    imageHtml = `
                            <div class="card-img-top-container">
                                <img src="/tegel_webapp/get-image?id=${imageId}"
                                     class="card-img-top event-image" alt="${event.title}">
                            </div>`;
                } else {
                    imageHtml = `
                            <div class="card-img-top-container">
                                <img src="${event.image}" class="card-img-top event-image" alt="${event.title}">
                            </div>`;
                }
            } else {
                imageHtml = `
                        <div class="card-img-top-container">
                            <div class="card-img-top event-image-placeholder d-flex align-items-center justify-content-center bg-light">
                                <i class="bi bi-image text-muted" style="font-size: 3rem;"></i>
                            </div>
                        </div>`;
            }

            const eventCard = document.createElement('div');
            eventCard.className = 'col-lg-4 col-md-6';
            eventCard.innerHTML = `
                    <div class="card event-tile h-100 shadow-sm">
                        ${imageHtml}
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title event-title">${event.title}</h5>
                            <p class="card-text event-description">${event.description || 'No description available.'}</p>

                            <div class="mt-auto">
                                <div class="d-flex align-items-center mb-3">
                                    <i class="bi bi-calendar-event text-orange me-2"></i>
                                    <span>${displayDate}</span>
                                </div>
                                <div class="d-flex align-items-center mb-3">
                                    <i class="bi bi-geo-alt text-orange me-2"></i>
                                    <span>${event.location || 'Location TBA'}</span>
                                </div>
                                <div class="d-flex align-items-center mb-3">
                                    <i class="bi bi-people text-orange me-2"></i>
                                    <span>${event.currentParticipants || 0}/${event.maxParticipants || '∞'} enrolled</span>
                                </div>

                                <button class="btn btn-orange w-100" onclick="selectEvent(${event.id || event.eventId})">
                                    <i class="bi bi-arrow-right-circle me-1"></i> View Details
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            container.appendChild(eventCard);
        });
    }

    function selectEvent(eventId) {
        // Redirect to event details page with event ID as parameter
        window.location.href = `event-details.html?eventId=${eventId}`;
    }

    function searchEvents() {
        const query = document.getElementById('eventSearchInput').value.toLowerCase();
        if (!query) {
            // If search is empty, reload all events
            loadEvents();
            return;
        }

        const filteredEvents = currentEvents.filter(event => {
            return event.title.toLowerCase().includes(query) ||
                (event.location && event.location.toLowerCase().includes(query)) ||
                (event.description && event.description.toLowerCase().includes(query));
        });

        if (filteredEvents.length === 0) {
            // No matching events found
            const container = document.getElementById('eventsContainer');
            container.innerHTML = '<div class="col-12"><p class="text-center">Event not found⚠️!</p></div>';
        } else {
            displayEvents(filteredEvents);
        }
    }

    function resetEventSearch() {
        document.getElementById('eventSearchInput').value = '';
        // Reload all events from server
        loadEvents();
    }

    function createEvent(event) {
        event.preventDefault();

        const form = document.getElementById('eventCreateForm');
        const formData = new FormData(form);

        // Handle checkboxes
        const hasFoodOption = document.getElementById('hasFoodOption').checked;
        const isActive = document.getElementById('isActive').checked;
        const isPublic = document.getElementById('isPublic').checked;

        formData.set('hasFoodOption', hasFoodOption ? 'true' : 'false');
        formData.set('isActive', isActive ? 'true' : 'false');
        formData.set('isPublic', isPublic ? 'true' : 'false');

        // Validate form (keep your existing validation)

        // Changed URL from /admin/events to /events
        fetch('/tegel_webapp/events', {
            method: 'POST',
            body: formData
        })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.error || 'Failed to create event');
                    });
                }
                return response.json();
            })
            .then(data => {
                showMessage('Event created successfully!', 'success');
                setTimeout(() => {
                    // Close the modal and reload events
                    const modal = bootstrap.Modal.getInstance(document.getElementById('createEventModal'));
                    modal.hide();
                    loadEvents();
                }, 1500);
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage(error.message, 'danger');
            });
    }

    // Helper function to show messages
    function showMessage(message, type) {
        const msgContainer = document.getElementById('adminEventCreateMsg');
        msgContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;

        // Auto-dismiss success messages
        if (type === 'success') {
            setTimeout(() => {
                msgContainer.innerHTML = '';
            }, 3000);
        }
    }

    document.addEventListener('DOMContentLoaded', loadEvents);

    // Admin event creation functionality
    document.addEventListener('DOMContentLoaded', function () {
        // Handle event creation form submission via the submit button in modal
        document.getElementById('submitEventBtn').addEventListener('click', function (e) {
            e.preventDefault()
            createEvent(e);
        });

        // Insert at the top of the main content
        const mainContent = document.querySelector('main');
        mainContent.insertBefore(notification, mainContent.firstChild);

        // Auto-dismiss after 5 seconds
        setTimeout(() => {
            notification.classList.remove('show');
            setTimeout(() => notification.remove(), 500);
        }, 5000);


        // Reset the form and error messages when the modal is closed
        const createEventModal = document.getElementById('createEventModal');
        if (createEventModal) {
            createEventModal.addEventListener('hidden.bs.modal', function () {
                const form = document.getElementById('adminEventCreateForm');
                if (form) form.reset();

                const msgElement = document.getElementById('adminEventCreateMsg');
                if (msgElement) {
                    msgElement.textContent = '';
                    msgElement.className = '';
                }
            });
        }
    });
</script>
