<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Tegel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="styles.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .signup-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
        }
        .signup-image {
            display: none;
            flex: 1;
            margin-right: 3rem;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .signup-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .signup-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(252, 125, 4, 0.3), transparent);
        }
        .signup-form-section {
            flex: 1;
            max-width: 430px;
            width: 100%;
            margin: 0 auto;
        }
        .signup-card {
            background-color: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }
        .brand-logo {
            margin-bottom: 1.25rem;
        }
        .brand-logo img {
            height: 60px;
        }
        .signup-card h3 {
            color: #333;
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            background-color: #f8f9fa;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: rgba(252, 125, 4, 0.5);
            box-shadow: 0 0 0 4px rgba(252, 125, 4, 0.15);
        }
        .input-group .input-group-text {
            background-color: #f8f9fa;
            border: 1px solid #e0e0e0;
            border-left: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .input-group .form-control {
            border-right: none;
            border-radius: 8px 0 0 8px;
        }
        .btn-register {
            background: rgba(252, 125, 4, 1);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px rgba(252, 125, 4, 0.3);
        }
        .btn-register:hover {
            background: rgba(230, 115, 0, 1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(252, 125, 4, 0.4);
        }
        .btn-register:active {
            transform: translateY(0);
        }
        .auth-option {
            background-color: white;
            border-radius: 16px;
            padding: 1.25rem;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.03);
        }
        .auth-option p {
            margin: 0;
            font-size: 0.95rem;
        }
        .orange-link {
            color: rgba(252, 125, 4, 1);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .orange-link:hover {
            color: rgba(230, 115, 0, 1);
        }
        .form-label {
            display: none;
        }
        .tos-text {
            color: #666;
            font-size: 0.85rem;
            line-height: 1.5;
            margin: 1.25rem 0;
            text-align: center;
        }
        @media (min-width: 768px) {
            .signup-image {
                display: block;
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background: rgba(252,125,4,255);">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" style="padding:0;">
            <img src="images/TEGEL LOGO.png" alt="Tegel Logo"
                 style="height:40px; width:auto; display:inline-block; vertical-align:middle;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="events.html">Events</a>
                </li>
                <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="announcements.html">Announcements</a>
                </li>
            </ul>
            <div id="authButtons">
                <a href="signup.html" class="btn btn-light me-2">Sign Up</a>
                <a href="login.html" class="btn btn-light">Login</a>
            </div>
        </div>
    </div>
</nav>

<main>
    <div class="signup-container">
        <!-- Modern image section -->
        <div class="signup-image">
            <img src="images/slideshow/uni2.jpg" alt="Tegel campus image">
        </div>

        <!-- Signup form section -->
        <div class="signup-form-section">
            <div class="signup-card">
                <div class="brand-logo">
                    <img src="images/TEGEL LOGO.png" alt="Tegel Logo">
                </div>

                <h3>Join Tegel to participate in events and stay updated</h3>

                <div id="signupAlert"></div>

                <form id="signupForm">
                    <div class="form-group">
                        <input id="fullName" class="form-control" type="text" placeholder="Full Name" required>
                    </div>

                    <div class="form-group">
                        <input id="nickname" class="form-control" type="text" placeholder="Nickname (optional)">
                    </div>

                    <div class="form-group">
                        <input id="emailAddress" class="form-control" type="email" placeholder="Email address" required>
                    </div>

                    <div class="form-group">
                        <div class="input-group">
                            <input id="password" class="form-control" type="password" placeholder="Password" required>
                            <span class="input-group-text" id="togglePassword">
                                <i class="fas fa-eye-slash"></i>
                            </span>
                        </div>
                    </div>

                    <div class="form-group">
                        <input type="date" id="dob" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <input type="tel" id="phone" class="form-control" placeholder="Phone number" required>
                    </div>

                    <div class="form-group">
                        <textarea id="dietary" class="form-control" placeholder="Dietary restrictions (if any)" rows="2"></textarea>
                    </div>

                    <p class="tos-text">
                        By signing up, you agree to our <a href="terms-of-service.html" class="orange-link">Terms of Service</a> and <a href="privacy-policy.html" class="orange-link">Privacy Policy</a>.
                    </p>

                    <button type="submit" class="btn-register">Create Account</button>
                </form>
            </div>

            <div class="auth-option">
                <p>Already have an account? <a href="login.html" class="orange-link">Log In</a></p>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
        <div class="social-links">
            <a href="https://www.instagram.com/sgvtegel?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
               target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"
                     alt="Instagram"
                     style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);margin-right:15px;">
            </a>
            <a href="mailto:sgvtegel@gmail.com" target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg"
                     alt="Gmail"
                     style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);">
            </a>
        </div>
        <div class="address-text">Drienerlolaan 5, 7522 NB Enschede</div>
        <img class="footer-brand" src="images/TEGEL LOGO footer.png" alt="Tegel Logo"
             style="width: 90px; height: auto; filter: none; margin-right: 0;"/>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const signupForm = document.getElementById('signupForm');

        // Function to display alert messages
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.setAttribute('role', 'alert');
            alertDiv.style.fontSize = '13px';
            alertDiv.style.padding = '8px 12px';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;

            // Insert the alert before the form
            const alertContainer = document.getElementById('signupAlert');
            alertContainer.innerHTML = '';
            alertContainer.appendChild(alertDiv);
        }

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        });

        signupForm.addEventListener('submit', function (event) {
            event.preventDefault();

            // Show loading state
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Creating account...';

            const formData = new FormData();
            formData.append('fullName', document.getElementById('fullName').value);
            formData.append('nickname', document.getElementById('nickname').value);
            formData.append('emailAddress', document.getElementById('emailAddress').value);
            formData.append('password', document.getElementById('password').value);
            formData.append('dob', document.getElementById('dob').value);
            formData.append('phone', document.getElementById('phone').value);
            formData.append('dietary', document.getElementById('dietary').value);

            fetch('/tegel_webapp/signup', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.redirected) {
                    window.location.href = response.url;
                } else {
                    return response.json().then(data => {
                        if (data.success) {
                            window.location.href = 'login.html?registered=true';
                        } else {
                            showAlert(data.message || 'Registration failed. Please try again.', 'danger');
                            submitBtn.disabled = false;
                            submitBtn.textContent = originalText;
                        }
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert('Registration failed. Please check your connection and try again.', 'danger');
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            });
        });
    });
</script>
</body>
</html>
