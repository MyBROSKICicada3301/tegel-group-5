<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | Tegel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1 0 auto;
        }
        .announcements-section {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            padding: 40px 30px;
            margin-top: 40px;
        }
        .announcements-section h1 {
            color: #ff8c1a;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .announcements-section p {
            color: #333;
            font-size: 1.2rem;
        }
        .announcement-card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .announcement-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-3px);
        }
        .announcement-title {
            color: #ff8c1a;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .announcement-date {
            color: #777;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .announcement-content {
            color: #333;
            font-size: 1rem;
            white-space: pre-line;
        }
        .no-announcements {
            text-align: center;
            padding: 30px;
            color: #777;
            font-style: italic;
        }
        .loading-spinner {
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        @media (max-width: 768px) {
            .announcements-section {
                padding: 20px 10px;
                margin-top: 20px;
            }
            .announcements-section h1 {
                font-size: 2rem;
            }
            .announcements-section p {
                font-size: 1rem;
            }
        }
        .footer {
            background: #000;
            color: white;
            padding: 25px 0;
            margin-top: auto;
        }
        .footer img {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            filter: brightness(0) invert(1);
        }
        .footer a {
            text-decoration: none;
        }
        .social-links {
            display: flex;
            align-items: center;
        }
        .address-text {
            color: #ccc;
            font-size: 14px;
        }
        .footer-brand {
            font-family: 'Courier New', cursive;
            font-size: 24px;
            color: #ff8c1a;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .footer {
                text-align: center;
            }
            .footer .container {
                flex-direction: column !important;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background: rgba(252,125,4,255);">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" style="padding:0;">
            <img src="images/TEGEL LOGO.png" alt="Tegel Logo" style="height:40px; width:auto; display:inline-block; vertical-align:middle;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="events.html">Events</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="announcements.html">Announcements</a></li>
            </ul>
            <div id="authButtons">
                <a href="signup.html" class="btn btn-light me-2">Sign Up</a>
                <a href="login.html" class="btn btn-light">Login</a>
            </div>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div class="row justify-content-center mb-4">
        <div class="col-lg-8 col-md-10">
            <form id="searchForm" class="row g-2 mb-3" role="search" aria-label="Search announcements">
                <div class="col-12 col-md-8">
                    <input id="searchInput" class="form-control" type="search" placeholder="Search announcements..." aria-label="Search announcements">
                </div>
                <div class="col-12 col-md-4">
                    <input id="dateInput" class="form-control" type="date" aria-label="Search by date">
                </div>
                <div class="col-12 d-flex justify-content-end">
                    <button class="btn btn-outline-warning mt-2" type="submit">Search</button>
                    <button id="resetSearch" class="btn btn-outline-secondary mt-2 ms-2" type="button">Reset</button>
                </div>
            </form>
            <div class="announcements-section">
                <h1>Announcements</h1>
                <div id="announcements-container">
                    <div class="loading-spinner">
                        <div class="spinner-border text-warning" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
        <div class="social-links">
            <a href="https://www.instagram.com/sgvtegel" target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);margin-right:15px;">
            </a>
            <a href="mailto:sgvtegel@gmail.com" target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg" alt="Gmail" style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);">
            </a>
        </div>
        <div class="address-text">Drienerlolaan 5, 7522 NB Enschede</div>
        <img class="footer-brand" src="images/TEGEL LOGO footer.png" alt="Tegel Logo" style="width: 90px; height: auto; filter: none; margin-right: 0;" />
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Debug code to check if script is loaded
    console.log("Announcements page loaded");

    // Fetch announcements from the server
    function fetchAnnouncements(searchTerm = "", dateFilter = "") {
        let url = '/tegel_webapp/announcement';  // Updated to include context path

        // Add query parameters if provided
        if (searchTerm) {
            url += `?search=${encodeURIComponent(searchTerm)}`;
        } else if (dateFilter) {
            url += `?date=${encodeURIComponent(dateFilter)}`;
        }

        console.log(`[DEBUG] Fetching announcements from URL: ${url}`);

        fetch(url)
            .then(response => {
                console.log(`[DEBUG] Announcement response status: ${response.status}`);
                if (!response.ok) {
                    throw new Error(`Network response was not ok (Status: ${response.status})`);
                }
                return response.json();
            })
            .then(announcements => {
                console.log(`[DEBUG] Received ${announcements.length} announcements`);
                displayAnnouncements(announcements);
            })
            .catch(error => {
                console.error('Error fetching announcements:', error);
                displayError('Failed to load announcements. Please try again later.');
            });
    }

    // Display announcements in the container
    function displayAnnouncements(announcements) {
        const container = document.getElementById('announcements-container');
        container.innerHTML = ''; // Clear loading spinner or previous results

        if (!announcements || announcements.length === 0) {
            container.innerHTML = '<div class="no-announcements">No announcements found. Stay tuned!</div>';
            return;
        }

        // Loop through announcements and create HTML for each
        announcements.forEach(announcement => {
            const announcementElement = document.createElement('div');
            announcementElement.className = 'announcement-card';

            // Format date for display
            const createdDate = new Date(announcement.createdAt);
            const formattedDate = createdDate.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            // Create announcement HTML
            announcementElement.innerHTML = `
                <div class="announcement-title">${announcement.title}</div>
                <div class="announcement-date">${formattedDate}</div>
                <div class="announcement-content">${announcement.content}</div>
            `;

            container.appendChild(announcementElement);
        });
    }

    // Display error message
    function displayError(message) {
        const container = document.getElementById('announcements-container');
        container.innerHTML = `<div class="alert alert-danger" role="alert">${message}</div>`;
    }

    // Handle search form submission
    document.getElementById('searchForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent normal form submission

        const searchTerm = document.getElementById('searchInput').value.trim();
        const dateFilter = document.getElementById('dateInput').value;

        // Show loading spinner
        document.getElementById('announcements-container').innerHTML = `
            <div class="loading-spinner">
                <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        `;

        // Fetch filtered announcements
        if (searchTerm) {
            fetchAnnouncements(searchTerm, "");
        } else if (dateFilter) {
            fetchAnnouncements("", dateFilter);
        } else {
            fetchAnnouncements();
        }
    });

    // Reset search form
    document.getElementById('resetSearch').addEventListener('click', function() {
        document.getElementById('searchInput').value = '';
        document.getElementById('dateInput').value = '';

        // Show loading spinner
        document.getElementById('announcements-container').innerHTML = `
            <div class="loading-spinner">
                <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        `;

        // Fetch all announcements
        fetchAnnouncements();
    });

    // Ensure session is checked on page load
    document.addEventListener('DOMContentLoaded', function() {
        console.log("DOM fully loaded");

        // Fetch announcements on page load
        fetchAnnouncements();

        // Force a check of the session status
        fetch('/tegel_webapp/check-session', {
            method: 'GET',
            credentials: 'include'
        })
        .then(response => response.json())
        .then(data => {
            console.log("Session check response:", data);
            if(data.loggedIn) {
                const authButtons = document.getElementById('authButtons');
                if (authButtons) {
                    authButtons.innerHTML = `
                        <a href="#" class="btn btn-light me-2" id="accountBtn">Account</a>
                        <a href="#" class="btn btn-light" id="signoutBtn">Sign Out</a>
                    `;

                    // Add click event listener to sign out button
                    document.getElementById('signoutBtn').addEventListener('click', function(e) {
                        e.preventDefault();
                        signOut();
                    });

                    // Add click event for account button
                    document.getElementById('accountBtn').addEventListener('click', function(e) {
                        e.preventDefault();
                        // Redirect to account page
                        window.location.href = 'account.html';
                    });
                }
            }
        })
        .catch(error => {
            console.error('Error checking login status:', error);
        });
    });

    function signOut() {
        fetch('/tegel_webapp/logout', {
            method: 'POST',
            credentials: 'include'
        })
        .then(() => {
            // Redirect to home page after successful logout
            window.location.href = 'index.html';
        })
        .catch(error => {
            console.error('Error signing out:', error);
        });
    }
</script>
<script src="js/debug-utils.js"></script>
<script src="js/session-manager.js"></script>
<script src="js/auth-scripts.js"></script>
</body>
</html>
