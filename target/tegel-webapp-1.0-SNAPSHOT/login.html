    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .login-container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
        }
        .login-image {
            display: none;
            flex: 1;
            margin-right: 3rem;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .login-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .login-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(252, 125, 4, 0.3), transparent);
        }
        .login-form-section {
            flex: 1;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }
        .login-card {
            background-color: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }
        .brand-logo {
            margin-bottom: 1.5rem;
        }
        .brand-logo img {
            height: 60px;
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            background-color: #f8f9fa;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }
        .form-control:focus {
            border-color: rgba(252, 125, 4, 0.5);
            box-shadow: 0 0 0 4px rgba(252, 125, 4, 0.15);
        }
        .input-group .input-group-text {
            background-color: #f8f9fa;
            border: 1px solid #e0e0e0;
            border-left: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .input-group .form-control {
            border-right: none;
            border-radius: 8px 0 0 8px;
            margin-bottom: 0;
        }
        .btn-login {
            background: rgba(252, 125, 4, 1);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            width: 100%;
            margin-top: 1.25rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 2px 10px rgba(252, 125, 4, 0.3);
        }
        .btn-login:hover {
            background: rgba(230, 115, 0, 1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(252, 125, 4, 0.4);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .or-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }
        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }
        .or-divider-text {
            color: #9e9e9e;
            font-size: 0.85rem;
            margin: 0 1rem;
            text-transform: uppercase;
        }
        .auth-option {
            background-color: white;
            border-radius: 16px;
            padding: 1.25rem;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.03);
        }
        .auth-option p {
            margin: 0;
            font-size: 0.95rem;
        }
        .orange-link {
            color: rgba(252, 125, 4, 1);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        .orange-link:hover {
            color: rgba(230, 115, 0, 1);
        }
        .forgot-password {
            font-size: 0.9rem;
            color: rgba(252, 125, 4, 1);
            text-decoration: none;
            display: block;
            margin-top: 0.5rem;
            transition: color 0.2s ease;
        }
        .forgot-password:hover {
            color: rgba(230, 115, 0, 1);
        }
        .remember-me {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-top: 1rem;
        }
        .remember-me label {
            font-size: 0.9rem;
            margin-left: 0.5rem;
            margin-bottom: 0;
            color: #5a5a5a;
        }
        .form-check-input:checked {
            background-color: rgba(252, 125, 4, 1);
            border-color: rgba(252, 125, 4, 1);
        }
        @media (min-width: 768px) {
            .login-image {
                display: block;
            }
        }
    </style>
</head>

                <li class="nav-item"><a class="nav-link text-white" href="events.html">Events</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>

            </ul>

<main>
    <div class="login-container">
        <!-- Modern image section -->
        <div class="login-image">
            <img src="images/slideshow/uni1.jpg" alt="Tegel campus image">
        </div>

        <!-- Login form section -->
        <div class="login-form-section">
            <div class="login-card">
                <div class="brand-logo">
                    <img src="images/TEGEL LOGO.png" alt="Tegel Logo">
                </div>

                <div id="loginAlert"></div>

                <form id="loginForm">
                    <input id="email" name="email" class="form-control" type="email" placeholder="Email" required>

                    <div class="input-group mb-3">
                        <input id="password" name="password" class="form-control" type="password" placeholder="Password" required>
                        <span class="input-group-text" id="togglePassword">
                            <i class="fas fa-eye-slash"></i>
                        </span>
                    </div>

                    <div class="remember-me">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="btn-login">Log In</button>

                    <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
                </form>
            </div>

            <div class="auth-option">
                <p>Don't have an account? <a href="signup.html" class="orange-link">Sign up</a></p>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/session-manager.js"></script>
<script>
    // Check for error parameters in URL and display appropriate message
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');

        if (error) {
            const errorMessages = {
                'wrong_password': 'Enter a valid Username or Password',
                'user_not_found': 'Enter a valid Username or Password',
                'invalid_email': 'Enter a valid Username or Password',
                'missing': 'Please enter both email and password.',
                'security': 'Security issue detected. Please try again.',
                'server': 'Server error. Please try again later.',
                'invalid': 'Invalid login credentials. Please try again.'
            };

            const message = errorMessages[error] || 'Login failed. Please try again.';
            showAlert(message, 'danger');
        }
    };

    // Function to display alert messages
    function showAlert(message, type) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
        alertDiv.setAttribute('role', 'alert');
        alertDiv.style.fontSize = '13px';
        alertDiv.style.padding = '8px 12px';
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;

        // Insert the alert before the form
        const alertContainer = document.getElementById('loginAlert');
        alertContainer.innerHTML = '';
        alertContainer.appendChild(alertDiv);
    }

    // Form submission handler
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Show loading state
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Logging in...';

        const formData = new FormData();
        formData.append('email', document.getElementById('email').value);
        formData.append('password', document.getElementById('password').value);

        // Add remember me if it exists
        if (document.getElementById('rememberMe')) {
            formData.append('rememberMe', document.getElementById('rememberMe').checked);
        }

        console.log("Submitting login data");
        fetch('/tegel_webapp/login', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.redirected) {
                window.location.href = response.url;
            } else {
                // Client-side validation - the server should handle most cases
                console.error('Login failed: Server returned non-redirect response');
                showAlert('Login failed. Please try again.', 'danger');
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showAlert('Login failed. Please check your connection and try again.', 'danger');
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        });
    });

    // Password toggle functionality
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        } else {
            passwordInput.type = 'password';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        }
    });
</script>
</body>
