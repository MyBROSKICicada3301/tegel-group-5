<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Tegel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffb56b 0%, #ff8c1a 100%);
            margin: 0;
            padding: 0;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
        }
        .navbar-brand {
            font-family: 'Courier New', cursive;
            font-size: 28px;
            font-weight: bold;
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 1100px;
            width: 100%;
            margin-bottom: 40px;
        }
        .admin-card h2 {
            color: #333;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
        }
        .table thead th {
            background: #ff8c1a;
            color: #fff;
            border: none;
        }
        .table tbody tr {
            background: rgba(255,255,255,0.85);
        }
        .btn-role {
            min-width: 100px;
        }
        .btn-delete {
            background: #e74c3c;
            color: #fff;
        }
        .btn-delete:hover {
            background: #c0392b;
            color: #fff;
        }
        .footer {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 25px 0;
            backdrop-filter: blur(10px);
        }
        .footer img {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            filter: brightness(0) invert(1);
        }
        .footer a {
            text-decoration: none;
        }
        .social-links {
            display: flex;
            align-items: center;
        }
        .address-text {
            color: #ccc;
            font-size: 14px;
        }
        .footer-brand {
            font-family: 'Courier New', cursive;
            font-size: 24px;
            color: #ff8c1a;
            font-weight: bold;
        }
        @media (max-width: 900px) {
            .admin-card {
                padding: 20px 5px;
            }
            .table-responsive {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg" style="background: rgba(252,125,4,255);">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" style="padding:0;">
            <img src="images/TEGEL LOGO.png" alt="Tegel Logo" style="height:40px; width:auto; display:inline-block; vertical-align:middle;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="events.html">Events</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="announcements.html">Announcements</a></li>
            </ul>
            <div>
                <a href="signup.html" class="btn btn-light me-2">Sign Up</a>
                <a href="login.html" class="btn btn-light">Login</a>
            </div>
        </div>
    </div>
</nav>

<main>
    <div class="admin-card mb-4">
        <h2>User Management</h2>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Users will be loaded here by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <div class="admin-card">
        <h2>All Events</h2>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Event Name</th>
                        <th>Date</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="eventTableBody">
                    <!-- Events will be loaded here by JS -->
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
        <div class="social-links">
            <a href="https://www.instagram.com/sgvtegel?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);margin-right:15px;">
            </a>
            <a href="mailto:sgvtegel@gmail.com" target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg" alt="Gmail" style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);">
            </a>
        </div>
        <div class="address-text">Drienerlolaan 5, 7522 NB Enschede</div>
        <img class="footer-brand" src="images/TEGEL LOGO footer.png" alt="Tegel Logo" style="width: 90px; height: auto; filter: none; margin-right: 0;" />
    </div>
</footer>

<script>
    let users = [];
    let events = [];

    // Load users from database
    function loadUsers() {
        fetch('/admin/users')
            .then(response => response.json())
            .then(data => {
                users = data;
                renderUsers();
            })
            .catch(error => {
                console.error('Error loading users:', error);
            });
    }

    // Load events from database
    function loadEvents() {
        fetch('/events')
            .then(response => response.json())
            .then(data => {
                events = data;
                renderEvents();
            })
            .catch(error => {
                console.error('Error loading events:', error);
            });
    }

    function renderUsers() {
        const tbody = document.getElementById('userTableBody');
        tbody.innerHTML = '';
        users.forEach(user => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${user.fullName || user.email}</td>
                <td>${user.email}</td>
                <td>
                    <select class="form-select btn-role" data-id="${user.userId}">
                        <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>Admin</option>
                        <option value="member" ${user.role === 'member' ? 'selected' : ''}>Member</option>
                        <option value="user" ${user.role === 'user' ? 'selected' : ''}>User</option>
                    </select>
                </td>
                <td>
                    <button class="btn btn-info btn-sm me-2" onclick="viewUser(${user.userId})">View</button>
                    <button class="btn btn-delete btn-sm" onclick="deleteUser(${user.userId})">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Add event listeners for role change
        document.querySelectorAll('.btn-role').forEach(select => {
            select.addEventListener('change', function() {
                const userId = parseInt(this.getAttribute('data-id'));
                const newRole = this.value;
                updateUserRole(userId, newRole);
            });
        });
    }

    function renderEvents() {
        const tbody = document.getElementById('eventTableBody');
        tbody.innerHTML = '';
        events.forEach(event => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${event.title}</td>
                <td>${event.date}</td>
                <td>${event.description || 'No description'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateUserRole(userId, newRole) {
        const formData = new FormData();
        formData.append('userId', userId);
        formData.append('newRole', newRole);

        fetch('/admin/updateRole', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const user = users.find(u => u.userId === userId);
                if (user) {
                    user.role = newRole;
                    alert(`Role updated successfully.`);
                }
            } else {
                alert('Failed to update role.');
                loadUsers(); // Reload to reset the dropdown
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Error updating role.');
        });
    }

    function deleteUser(userId) {
        if (confirm("Are you sure you want to delete this user?")) {
            fetch(`/admin/user/${userId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    users = users.filter(u => u.userId !== userId);
                    renderUsers();
                    alert('User deleted successfully.');
                } else {
                    alert('Failed to delete user.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error deleting user.');
            });
        }
    }

    function viewUser(userId) {
        const user = users.find(u => u.userId === userId);
        if (user) {
            alert(`User Details:\n\nName: ${user.fullName || 'N/A'}\nEmail: ${user.email}\nRole: ${user.role}\nPhone: ${user.phoneNumber || 'N/A'}\nDiet: ${user.dietRes || 'None'}`);
        }
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', function() {
        loadUsers();
        loadEvents();
    });
</script>

</body>
</html>
