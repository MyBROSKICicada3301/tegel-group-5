<body>
    <!-- Admin-only event creation form -->
    <!-- Modal for creating events -->
    <div class="modal fade" id="createEventModal" tabindex="-1" aria-labelledby="createEventModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createEventModalLabel">Create New Event</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="adminEventCreateForm">
                        <div class="mb-3">
                            <label for="eventTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="eventTitle" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="eventDescription" name="description" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="eventDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="eventDate" name="date" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventLocation" class="form-label">Location</label>
                            <input type="text" class="form-control" id="eventLocation" name="location" value="Tegel Community Center" required>
                        </div>
                        <div class="mb-3">
                            <label for="maxParticipants" class="form-label">Maximum Participants</label>
                            <input type="number" class="form-control" id="maxParticipants" name="maxParticipants" value="50" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventPrice" class="form-label">Event Price (€)</label>
                            <input type="number" class="form-control" id="eventPrice" name="price"
                                   min="0" step="0.01" value="0.00">
                            <small class="form-text text-muted">Set to 0 for free events</small>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="hasFoodOption" name="hasFoodOption">
                                <label class="form-check-label" for="hasFoodOption">
                                    This event includes food options
                                </label>
                                <div class="form-text">Enables participants to select food options during enrollment</div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isPublic" name="isPublic" checked>
                                <label class="form-check-label" for="isPublic">
                                    Make this event public
                                </label>
                                <div class="form-text">Public events are visible to all users</div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="isActive" name="isActive" checked>
                                <label class="form-check-label" for="isActive">
                                    Active Event
                                </label>
                            </div>
                        </div>
                        <div id="adminEventCreateMsg" class="mt-2"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="submitEventBtn">Create Event</button>
                </div>
            </div>
        </div>
    </div>

<main class="container my-4">
    <div class="mb-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="input-group">
                    <input type="text" class="form-control" id="eventSearchInput" placeholder="Search events by name, location...">
                    <button class="btn btn-primary" type="button" onclick="searchEvents()">Search</button>
                    <button class="btn btn-secondary" type="button" onclick="resetEventSearch()">Reset</button>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-4" id="eventsContainer">
        <!-- Events will be loaded here -->
    </div>
</main>

<script>
    function loadEvents() {
        console.log('Loading events from server...');
        fetch('/tegel_webapp/events')
            .then(response => {
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                return response.text(); // Get response as text first for debugging
            })
            .then(text => {
                console.log('Raw response:', text);
                try {
                    const events = JSON.parse(text);
                    console.log('Parsed events:', events);
                    if (!Array.isArray(events)) {
                        console.error('Events is not an array:', events);
                        throw new Error('Expected array of events');
                    }
                    displayEvents(events);
                } catch (e) {
                    console.error('JSON parse error:', e);
                    console.log('Showing empty events list due to error');
                    displayEvents([]);  // Display empty array instead of dummy events
                }
            })
            .catch(error => {
                console.error('Error loading events from server:', error);
                // Show empty state instead of dummy data
                console.log('Showing empty events list due to server error');
                displayEvents([]);
            });
    }

    // Store the current events that are displayed
    let currentEvents = [];

    // Update displayEvents to store the events in currentEvents
    function displayEvents(events) {
        currentEvents = events; // Store the events for search functionality
        const container = document.getElementById('eventsContainer');
        container.innerHTML = '';

        if (events.length === 0) {
            container.innerHTML = '<div class="col-12"><p class="text-center">No events available.</p></div>';
            return;
        }

        events.forEach(event => {
            const eventCard = document.createElement('div');
            eventCard.className = 'col-lg-4 col-md-6';

            // Calculate duration or use provided duration
            let duration = 'Duration not specified';
            if (event.startTime && event.endTime) {
                duration = `${event.startTime} - ${event.endTime}`;
            } else if (event.duration) {
                duration = event.duration;
            }

            // Format date for display
            let displayDate = event.date;
            if (event.date) {
                const eventDate = new Date(event.date);
                displayDate = eventDate.toLocaleDateString('en-US', {
                    weekday: 'short',
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            }

            eventCard.innerHTML = `
                <div class="card event-tile h-100">
                    <div class="card-body d-flex flex-column">
                        <h5 class="event-title">${event.title}</h5>
                        <p class="event-description">${event.description || 'No description available.'}</p>
                        <div class="event-duration mb-3">
                            <i class="bi bi-clock"></i> ${duration}
                        </div>
                        <div class="event-date mb-3" style="color: #ff8c1a; font-weight: bold;">
                            📅 ${displayDate}
                        </div>
                        <div class="event-location mb-3" style="color: #666; font-size: 14px;">
                            📍 ${event.location || 'Location TBA'}
                        </div>
                        <div class="event-participants mb-3" style="color: #333; font-size: 14px;">
                            👥 ${event.currentParticipants || 0}/${event.maxParticipants || '∞'} enrolled
                        </div>
                        <div class="mt-auto">
                            <button class="btn btn-select" onclick="selectEvent(${event.id || event.eventId})">
                                Select
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(eventCard);
        });
    }

    function selectEvent(eventId) {
        // Redirect to event details page with event ID as parameter
        window.location.href = `event-details.html?eventId=${eventId}`;
    }

    function searchEvents() {
        const query = document.getElementById('eventSearchInput').value.toLowerCase();
        if (!query) {
            // If search is empty, reload all events
            loadEvents();
            return;
        }

        const filteredEvents = currentEvents.filter(event => {
            return event.title.toLowerCase().includes(query) ||
                   (event.location && event.location.toLowerCase().includes(query)) ||
                   (event.description && event.description.toLowerCase().includes(query));
        });

        if (filteredEvents.length === 0) {
            // No matching events found
            const container = document.getElementById('eventsContainer');
            container.innerHTML = '<div class="col-12"><p class="text-center">Event not found⚠️!</p></div>';
        } else {
            displayEvents(filteredEvents);
        }
    }

    function resetEventSearch() {
        document.getElementById('eventSearchInput').value = '';
        // Reload all events from server
        loadEvents();
    }

    function createEvent(event) {
        event.preventDefault(); // Prevent default form submission

        const form = document.getElementById('adminEventCreateForm');
        const formData = new FormData(form);

        // Handle checkboxes
        const hasFoodOption = document.getElementById('hasFoodOption').checked;
        const isActive = document.getElementById('isActive').checked;
        const isPublic = document.getElementById('isPublic').checked;

        formData.set('hasFoodOption', hasFoodOption ? 'true' : 'false');
        formData.set('isActive', isActive ? 'true' : 'false');
        formData.set('isPublic', isPublic ? 'true' : 'false');

        // Validate required fields
        if (!formData.get('title') || !formData.get('date')) {
            showMessage('Please fill in all required fields.', 'danger');
            return;
        }

        // Validate date is not in the past
        const eventDate = new Date(formData.get('date'));
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        if (eventDate < today) {
            showMessage('Event date cannot be in the past.', 'danger');
            return;
        }

        fetch('/tegel_webapp/admin/events', {
            method: 'POST',
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                if (data.eventId || data.success) {
                    showMessage('Event created successfully!', 'success');
                    setTimeout(() => {
                        bootstrap.Modal.getInstance(document.getElementById('createEventModal')).hide();
                        form.reset();
                        loadEvents(); // Reload events if you have that function
                    }, 1500);
                } else {
                    showMessage(data.error || 'Failed to create event.', 'danger');
                }
            })
            .catch(error => {
                console.error('Error creating event:', error);
                showMessage('Error creating event. Please try again.', 'danger');
            });
    }

    // Helper function to show messages
    function showMessage(message, type) {
        const msgContainer = document.getElementById('adminEventCreateMsg');
        msgContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;

        // Auto-dismiss success messages
        if (type === 'success') {
            setTimeout(() => {
                msgContainer.innerHTML = '';
            }, 3000);
        }
    }

    document.addEventListener('DOMContentLoaded', loadEvents);

    // Admin event creation functionality
    document.addEventListener('DOMContentLoaded', function() {
        // Handle event creation form submission via the submit button in modal
        document.getElementById('submitEventBtn').addEventListener('click', function(e) {
           e.preventDefault()
            createEvent(e);
        });

            const mainContent = document.querySelector('main');
            mainContent.insertBefore(notification, mainContent.firstChild);

            // Auto-dismiss after 5 seconds
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => notification.remove(), 500);
            }, 5000);


        // Reset the form and error messages when the modal is closed
        const createEventModal = document.getElementById('createEventModal');
        if (createEventModal) {
            createEventModal.addEventListener('hidden.bs.modal', function() {
                const form = document.getElementById('adminEventCreateForm');
                if (form) form.reset();

                const msgElement = document.getElementById('adminEventCreateMsg');
                if (msgElement) {
                    msgElement.textContent = '';
                    msgElement.className = '';
                }
            });
        }
    });
</script>
