<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Tegel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffb56b 0%, #ff8c1a 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .navbar-brand {
            font-family: 'Courier New', cursive;
            font-size: 28px;
            font-weight: bold;
        }

        .signup-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 800px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .signup-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }

        .signup-card h3 {
            color: #ff8c1a;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .form-control {
            border-radius: 8px;
            border: 2px solid #ddd;
            padding: 12px 15px;
            font-size: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: white;
            margin-bottom: 20px;
        }

        .form-control:focus {
            border-color: #ff8c1a;
            box-shadow: 0 0 0 0.2rem rgba(255, 140, 26, 0.25);
            outline: none;
        }

        .form-control::placeholder {
            color: #999;
            font-style: italic;
        }

        .dietary-section {
            grid-column: 1 / -1;
        }

        .dietary-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn-submit, .btn-register {
            background: linear-gradient(45deg, #ff8c1a, #ffb56b);
            border: none;
            border-radius: 12px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin: 30px auto 0;
            min-width: 200px;
        }

        .btn-submit:hover, .btn-register:hover {
            background: linear-gradient(45deg, #e67e22, #ff8c1a);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 140, 26, 0.3);
        }

        .footer {
            background: rgb(0, 0, 0);
            color: white;
            padding: 25px 0;
            backdrop-filter: blur(10px);
            margin-top: auto;
        }

        .footer img {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            filter: brightness(0) invert(1);
        }

        .footer a {
            text-decoration: none;
        }

        .social-links {
            display: flex;
            align-items: center;
        }

        .address-text {
            color: #ccc;
            font-size: 14px;
        }

        .footer-brand {
            font-family: 'Courier New', cursive;
            font-size: 24px;
            color: #ff8c1a;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .signup-card {
                padding: 30px 20px;
                margin: 20px;
            }

            .signup-card h3 {
                font-size: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background: rgba(252,125,4,255);">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" style="padding:0;">
            <img src="images/TEGEL LOGO.png" alt="Tegel Logo"
                 style="height:40px; width:auto; display:inline-block; vertical-align:middle;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="events.html">Events</a>
                </li>
                <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="announcements.html">Announcements</a>
                </li>
            </ul>
            <div>
                <a href="signup.html" class="btn btn-light me-2">Sign Up</a>
                <a href="login.html" class="btn btn-light">Login</a>
            </div>
        </div>
    </div>
</nav>

<main>
    <div class="signup-card">
        <h3>Sign Up</h3>
        <form id="signupForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="fullName">Full Name:</label>
                    <input id="fullName" class="form-control" type="text" placeholder="Full Name"
                           required>
                </div>
                <div class="form-group">
                    <label for="nickname">Nickname (optional):</label>
                    <input id="nickname" class="form-control" type="text" placeholder="Nickname">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="emailAddress">Email Address:</label>
                    <input id="emailAddress" class="form-control" type="email"
                           placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input id="password" class="form-control" type="password" placeholder="Password"
                           required>
                </div>
            </div>
            <!-- Personal Details Section -->
            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone no.:</label>
                    <input type="tel" id="phone" class="form-control" placeholder="Phone no."
                           required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group dietary-section">
                    <label for="dietary">Dietary Restrictions (if any):</label>
                    <textarea id="dietary" class="form-control dietary-textarea"
                              placeholder="Dietary restrictions" rows="4"></textarea>
                </div>
            </div>
            <button type="submit" class="btn-register w-100">Create Account</button>
        </form>
        <div class="text-center mt-3">
            <p class="text-muted">Already have an account? <a href="login.html"
                                                              style="color: #ff8c1a; text-decoration: none;">Login
                here</a></p>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
        <div class="social-links">
            <a href="https://www.instagram.com/sgvtegel?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
               target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg"
                     alt="Instagram"
                     style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);margin-right:15px;">
            </a>
            <a href="mailto:sgvtegel@gmail.com" target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg"
                     alt="Gmail"
                     style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);">
            </a>
        </div>
        <div class="address-text">Drienerlolaan 5, 7522 NB Enschede</div>
        <img class="footer-brand" src="images/TEGEL LOGO footer.png" alt="Tegel Logo"
             style="width: 90px; height: auto; filter: none; margin-right: 0;"/>
    </div>
</footer>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const signupForm = document.getElementById('signupForm');
        signupForm.addEventListener('submit', function (event) {
            console.log("submission triggered")
            event.preventDefault();
            const formData = new FormData();
            formData.append('fullName', document.getElementById('fullName').value);
            formData.append('nickname', document.getElementById('nickname').value);
            formData.append('emailAddress', document.getElementById('emailAddress').value);
            formData.append('password', document.getElementById('password').value);
            formData.append('dob', document.getElementById('dob').value);
            formData.append('phone', document.getElementById('phone').value);
            formData.append('dietary', document.getElementById('dietary').value);

            console.log("fetching signup")
            fetch('/tegel_webapp/signup', {
                method: 'POST',
                body: formData
            })
                .then(response => {
                    console.log("response found")
                    if (response.redirected) {
                        window.location.href = response.url;
                    } else {
                        return response.text();
                    }
                })
                .then(data => {
                    if (data) {
                        alert('Registration failed. Please try again.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Registration failed. Please try again.');
                });
        });
    });

</script>
</body>
</html>
