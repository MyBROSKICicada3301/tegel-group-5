<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details | Tegel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            background: #ffb56b;
        }

        main {
            flex: 1;
            padding: 40px 20px;
        }

        .navbar-brand {
            font-family: 'Courier New', cursive;
            font-size: 24px;
        }

        .event-details-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            margin-bottom: 30px;
        }

        .event-title {
            color: #ff8c1a;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            border-bottom: 3px solid #ff8c1a;
            padding-bottom: 15px;
        }

        .event-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .info-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid #ff8c1a;
        }

        .info-label {
            font-weight: bold;
            color: #333;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .info-value {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        .description-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .description-title {
            color: #ff8c1a;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .enrollment-section {
            background: linear-gradient(135deg, #ff8c1a, #ffb56b);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .enrollment-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .enrollment-info {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .btn-enroll {
            background: white;
            color: #ff8c1a;
            border: none;
            border-radius: 12px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px;
        }

        .btn-enroll:hover {
            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            color: #e67e22;
        }

        .btn-back {
            background: linear-gradient(45deg, #6c757d, #868e96);
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 30px;
        }

        .btn-back:hover {
            background: linear-gradient(45deg, #5a6268, #6c757d);
            transform: translateY(-2px);
            color: white;
            text-decoration: none;
        }

        .footer {
            background: #000;
            color: white;
            padding: 20px;
        }

        .footer img {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }

        .social-links {
            display: flex;
            align-items: center;
        }

        .address-text {
            color: #ccc;
            font-size: 14px;
        }

        .footer-brand {
            font-family: 'Courier New', cursive;
            font-size: 24px;
            color: #ff8c1a;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .event-details-card {
                padding: 25px;
            }

            .event-title {
                font-size: 28px;
            }

            .event-info {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg" style="background: rgba(252,125,4,255);">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" style="padding:0;">
            <img src="images/TEGEL LOGO.png" alt="Tegel Logo" style="height:40px; width:auto; display:inline-block; vertical-align:middle;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="events.html">Events</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="announcements.html">Announcements</a></li>
            </ul>
            <div id="authButtons">
                <a href="signup.html" class="btn btn-light me-2">Sign Up</a>
                <a href="login.html" class="btn btn-light">Login</a>
            </div>
        </div>
    </div>
</nav>

<main class="container">
    <a href="events.html" class="btn-back">← Back to Events</a>

    <div id="eventContent">
        <div class="loading">Loading event details...</div>
    </div>
    <!-- Add this modal to your event-details.html page -->
    <div class="modal fade" id="enrollmentModal" tabindex="-1" aria-labelledby="enrollmentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="enrollmentModalLabel">Enroll in Event</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="enrollmentForm">
                        <input type="hidden" id="modalEventId">

                        <div id="foodOptionSection" style="display: none;">
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="wantsFoodOption">
                                    <label class="form-check-label" for="wantsFoodOption">
                                        I would like food at this event
                                    </label>
                                </div>
                            </div>

                            <div id="dietarySection" style="display: none;">
                                <div class="mb-3">
                                    <label for="dietaryRestrictions" class="form-label">Dietary Restrictions</label>
                                    <input type="text" class="form-control" id="dietaryRestrictions"
                                           placeholder="Vegetarian, vegan, allergies, etc.">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="specialRequests" class="form-label">Special Requests/Notes for Organizers</label>
                            <textarea class="form-control" id="specialRequests" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="confirmEnrollment">Enroll</button>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    // Dummy events for testing when backend is unavailable
    const dummyEvents = [
        {
            eventId: 1,
            title: "Group Game",
            description: "Join us for an exciting evening of team-building games and friendly competition. We'll have board games, video games, and interactive group activities that will bring everyone together for a fun-filled experience. This event is perfect for both new and existing members to get to know each other better while having a great time.",
            date: "2025-01-15",
            location: "Tegel Community Center",
            maxParticipants: 25,
            currentParticipants: 8,
            duration: "18:00 - 22:00"
        },
        {
            eventId: 2,
            title: "Outdoor Trek",
            description: "Experience the beautiful nature around Enschede with a guided hiking adventure. We'll explore scenic trails, enjoy fresh air, and capture amazing photos while building lasting memories with fellow Tegel members. Bring comfortable hiking shoes and water. Light snacks will be provided during our rest stops.",
            date: "2025-01-22",
            location: "Lonnekerberg Trail, Enschede",
            maxParticipants: 15,
            currentParticipants: 12,
            duration: "09:00 - 16:00"
        },
        {
            eventId: 3,
            title: "Module Ending Party",
            description: "Celebrate the successful completion of another academic module with an unforgettable party! Dancing, great food, drinks, and the perfect opportunity to unwind and socialize with friends after all the hard work. DJ, photo booth, and surprise activities included. Come ready to party and celebrate your achievements!",
            date: "2025-02-05",
            location: "Inter-Actief Main Hall",
            maxParticipants: 50,
            currentParticipants: 23,
            duration: "20:00 - 02:00"
        }
    ];

    // Extract event ID from URL query parameters
    function getEventIdFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('eventId');
    }

    // Load event details from server or use dummy data as fallback
    function loadEventDetails() {
        const eventId = getEventIdFromURL();

        // Show error if no event ID is provided
        if (!eventId) {
            document.getElementById('eventContent').innerHTML = `
                <div class="error">
                    <h3>Error</h3>
                    <p>No event ID provided. Please select an event from the events page.</p>
                    <a href="events.html" class="btn btn-enroll">Go to Events</a>
                </div>
            `;
            return;
        }

        console.log(`Attempting to load details for event ID: ${eventId}`);

        // Display loading indicator
        document.getElementById('eventContent').innerHTML = `
            <div class="loading">Loading event details for Event #${eventId}...</div>
        `;

        // Attempt to fetch event details from server
        fetch(`/tegel_webapp/events/${eventId}`)
            .then(response => {
                console.log(`Server response for event ${eventId}:`, response.status, response.statusText);
                if (!response.ok) {
                    throw new Error(`Event not found (Status ${response.status})`);
                }
                return response.json();
            })
            .then(event => {
                console.log('Event data received:', event);
                if (event && event.eventId) {
                    displayEventDetails(event);
                } else {
                    throw new Error('Invalid event data received');
                }
            })
            .catch(error => {
                console.error(`Error loading event ${eventId}:`, error);

                // Try to find dummy event as fallback
                const dummyEvent = dummyEvents.find(e => e.eventId == eventId);

                if (dummyEvent) {
                    console.log('Using dummy event data:', dummyEvent);
                    displayEventDetails(dummyEvent);
                } else {
                    document.getElementById('eventContent').innerHTML = `
                        <div class="error">
                            <h3>Error Loading Event #${eventId}</h3>
                            <p>Could not find event with ID ${eventId}. The event might not exist or there was a server error.</p>
                            <p>Technical details: ${error.message}</p>
                            <a href="events.html" class="btn btn-enroll">Go to Events</a>
                        </div>
                    `;
                }
            });
    }

    // Display event details in the UI
    function displayEventDetails(event) {
        let duration = 'Duration not specified';
        if (event.startTime && event.endTime) {
            duration = `${event.startTime} - ${event.endTime}`;
        } else if (event.duration) {
            duration = event.duration;
        }

        // Format date for display
        let displayDate = event.date;
        if (event.date) {
            try {
                const eventDate = new Date(event.date);
                displayDate = eventDate.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch (e) {
                console.warn('Error formatting date:', e);
                // Keep the original date format if parsing fails
            }
        }

        // Check if event is full
        const maxParticipants = event.maxParticipants || 0;
        const currentParticipants = event.currentParticipants || 0;
        const enrollmentStatus = maxParticipants > 0 && currentParticipants >= maxParticipants ? 'full' : 'available';
        const enrollmentText = enrollmentStatus === 'full' ? 'Event Full' : 'Spots Available';

        // Check if user is already enrolled in this event
        checkUserEnrollment(event.eventId)
            .then(isEnrolled => {
                // Update the UI with event details
                document.getElementById('eventContent').innerHTML = `
                    <div class="event-details-card">
                        <h1 class="event-title">${event.title || 'Unnamed Event'}</h1>

                        <div class="event-info">
                            <div class="info-section">
                                <div class="info-label">📅 Date</div>
                                <div class="info-value">${displayDate || 'Date not specified'}</div>
                            </div>

                            <div class="info-section">
                                <div class="info-label">📍 Location</div>
                                <div class="info-value">${event.location || 'Location not specified'}</div>
                            </div>

                            <div class="info-section">
                                <div class="info-label">⏰ Duration</div>
                                <div class="info-value">${duration}</div>
                            </div>

                            <div class="info-section">
                                <div class="info-label">👥 Participants</div>
                                <div class="info-value">
                                    ${currentParticipants} / ${maxParticipants > 0 ? maxParticipants : 'Unlimited'} enrolled
                                </div>
                            </div>
                        </div>

                        <div class="description-section">
                            <h3 class="description-title">Event Description</h3>
                            <p class="info-value">${event.description || 'No description available for this event.'}</p>
                        </div>

                        <div class="enrollment-section">
                            <h3 class="enrollment-title">${isEnrolled ? 'Already Enrolled' : 'Ready to Join?'}</h3>
                            <p class="enrollment-info">${isEnrolled ? 'You are currently enrolled in this event' : enrollmentText}</p>
                            ${isEnrolled ?
                                `<button class="btn-enroll btn-danger" onclick="deEnrollFromEvent(${event.eventId})">
                                    De-enroll from Event
                                </button>` :
                                enrollmentStatus === 'available' ?
                                    `<button class="btn-enroll" onclick="enrollInEvent(${event.eventId})">
                                        Enroll Now
                                    </button>` :
                                    `<button class="btn-enroll" disabled style="opacity: 0.6; cursor: not-allowed;">
                                        Event Full
                                    </button>`
                            }
                            <button class="btn-enroll" onclick="window.location.href='events.html'">
                                Browse Other Events
                            </button>
                        </div>
                    </div>
                `;
            })
            .catch(error => {
                console.error("Error checking enrollment status:", error);
                // Fall back to original display without enrollment check
                displayEventDetailsWithoutEnrollmentCheck(event, displayDate, duration, enrollmentStatus, enrollmentText);
            });
    }

    function displayEventDetailsWithoutEnrollmentCheck(event, displayDate, duration, enrollmentStatus, enrollmentText) {
        // This is a fallback method that displays the event details without enrollment check
        const maxParticipants = event.maxParticipants || 0;
        const currentParticipants = event.currentParticipants || 0;

        document.getElementById('eventContent').innerHTML = `
            <div class="event-details-card">
                <h1 class="event-title">${event.title || 'Unnamed Event'}</h1>

                <div class="event-info">
                    <div class="info-section">
                        <div class="info-label">📅 Date</div>
                        <div class="info-value">${displayDate || 'Date not specified'}</div>
                    </div>

                    <div class="info-section">
                        <div class="info-label">📍 Location</div>
                        <div class="info-value">${event.location || 'Location not specified'}</div>
                    </div>

                    <div class="info-section">
                        <div class="info-label">⏰ Duration</div>
                        <div class="info-value">${duration}</div>
                    </div>

                    <div class="info-section">
                        <div class="info-label">👥 Participants</div>
                        <div class="info-value">
                            ${currentParticipants} / ${maxParticipants > 0 ? maxParticipants : 'Unlimited'} enrolled
                        </div>
                    </div>
                </div>

                <div class="description-section">
                    <h3 class="description-title">Event Description</h3>
                    <p class="info-value">${event.description || 'No description available for this event.'}</p>
                </div>

                <div class="enrollment-section">
                    <h3 class="enrollment-title">Ready to Join?</h3>
                    <p class="enrollment-info">${enrollmentText}</p>
                    ${enrollmentStatus === 'available' ?
                        `<button class="btn-enroll" onclick="enrollInEvent(${event.eventId})">
                            Enroll Now
                        </button>` :
                        `<button class="btn-enroll" disabled style="opacity: 0.6; cursor: not-allowed;">
                            Event Full
                        </button>`
                    }
                    <button class="btn-enroll" onclick="window.location.href='events.html'">
                        Browse Other Events
                    </button>
                </div>
            </div>
        `;
    }

    // Check if the user is already enrolled in the event
    async function checkUserEnrollment(eventId) {
        console.log("Checking if user is enrolled in event:", eventId);

        try {
            // First check if user is logged in
            const sessionResponse = await fetch('/tegel_webapp/check-session', {
                method: 'GET',
                credentials: 'include'
            });

            const sessionData = await sessionResponse.json();
            if (!sessionData.loggedIn) {
                console.log("User is not logged in");
                return false;
            }

            // Get the user ID
            let userId = localStorage.getItem('userId');
            if (!userId) {
                // Try to get user ID from session
                const userInfoResponse = await fetch('/tegel_webapp/user-info', {
                    method: 'GET',
                    credentials: 'include'
                });

                if (!userInfoResponse.ok) {
                    throw new Error("Failed to retrieve user information");
                }

                const userData = await userInfoResponse.json();
                if (!userData.userId) {
                    throw new Error("User ID not found in user data");
                }

                userId = userData.userId;
                localStorage.setItem('userId', userId);
            }

            // Get the user's enrolled events
            const enrolledEventsResponse = await fetch('/tegel_webapp/user-events', {
                method: 'GET',
                credentials: 'include'
            });

            if (!enrolledEventsResponse.ok) {
                throw new Error("Failed to retrieve enrolled events");
            }

            const enrolledEventsData = await enrolledEventsResponse.json();

            // Check if the current event ID is in the enrolled events list
            if (enrolledEventsData.events && enrolledEventsData.events.length > 0) {
                const isEnrolled = enrolledEventsData.events.some(event => event.eventId == eventId);
                console.log("User enrollment status for event", eventId, ":", isEnrolled);
                return isEnrolled;
            }

            return false;
        } catch (error) {
            console.error("Error checking enrollment:", error);
            return false;
        }
    }

    // enroll current user in an event
    function enrollInEvent(eventId) {
        try {
            console.log("Starting enrollment process for event ID:", eventId);

            // Check if user is logged in
            fetch('/tegel_webapp/check-session', {
                method: 'GET',
                credentials: 'include'
            })
                .then(response => response.json())
                .then(sessionData => {
                    if (sessionData.loggedIn) {
                        // Get userId from localStorage
                        let userId = localStorage.getItem('userId');
                        console.log("User is logged in. Using localStorage userId:", userId);

                        if (!userId) {
                            // If userId is missing from localStorage but user is logged in
                            console.log("User ID not found in localStorage. Redirecting to login.");
                            throw new Error("User ID missing. Please login again.");
                        } else {
                            // Fetch event details to check if it has food options
                            fetch(`/tegel_webapp/events/${eventId}`)
                                .then(response => response.json())
                                .then(event => {
                                    showEnrollmentModal(eventId, event.hasFoodOption);
                                })
                                .catch(error => {
                                    console.error("Error fetching event details:", error);
                                    alert("Could not load event details. Please try again later.");
                                });
                        }
                    } else {
                        console.log("Server reports user is not logged in");
                        throw new Error("Not logged in");
                    }
                })
                .catch(error => {
                    console.error("Error during enrollment:", error);
                    if (error.message === "Not logged in") {
                        alert('Please log in to enroll in events.');
                        window.location.href = 'login.html?redirect=event-details.html?eventId=' + eventId;
                    } else if (error.message.includes("User ID")) {
                        alert('Your login session is incomplete. Please log in again.');
                        localStorage.removeItem('userId');
                        localStorage.removeItem('userLoggedIn');
                        window.location.href = 'login.html?redirect=event-details.html?eventId=' + eventId;
                    } else {
                        alert('An error occurred while enrolling. Please try again later.');
                    }
                });
        } catch (error) {
            console.error("Exception in enrollInEvent:", error);
            alert('An unexpected error occurred. Please try again later.');
        }
    }

    // Helper function to send the actual enrollment request
    function enrollWithUserId(eventId, userId) {
        // Create request payload
        const payload = {
            eventId: parseInt(eventId, 10),
            userId: parseInt(userId, 10)
        };

        console.log("Sending enrollment request with payload:", payload);

        // Send enrollment request to server
        return fetch('/tegel_webapp/events/enroll', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload),
            credentials: 'include'
        })
        .then(response => {
            console.log("Enrollment response received:", response.status);
            return response.json();
        })
        .then(responseData => {
            console.log("Response data:", responseData);
            if (responseData.success) {
                alert('Successfully enrolled in the event!');
                loadEventDetails(); // Reload to update participant count
            } else {
                alert(responseData.message || 'Failed to enroll in the event.');
            }
            return responseData;
        });
    }

    // De-enroll current user from an event
    function deEnrollFromEvent(eventId) {
        try {
            console.log("Starting de-enrollment process for event ID:", eventId);

            // Check if user is logged in by asking the server
            fetch('/tegel_webapp/check-session', {
                method: 'GET',
                credentials: 'include'
            })
            .then(response => response.json())
            .then(sessionData => {
                if (sessionData.loggedIn) {
                    // Get userId from localStorage
                    let userId = localStorage.getItem('userId');
                    console.log("User is logged in. Using localStorage userId:", userId);

                    // If userId is not in localStorage but user is logged in,
                    // we need to get the userId from session and store it
                    if (!userId) {
                        console.log("User ID not found in localStorage. Fetching from session...");

                        // Create a temporary endpoint call to get the userId from session
                        return fetch('/tegel_webapp/user-info', {
                            method: 'GET',
                            credentials: 'include'
                        })
                        .then(response => response.json())
                        .then(userData => {
                            if (userData && userData.userId) {
                                console.log("Retrieved userId from session:", userData.userId);

                                // Store userId in localStorage for future use
                                localStorage.setItem('userId', userData.userId);
                                localStorage.setItem('userLoggedIn', 'true');

                                // Continue with de-enrollment using the newly retrieved userId
                                return deEnrollWithUserId(eventId, userData.userId);
                            } else {
                                throw new Error("Could not retrieve user ID from session");
                            }
                        });
                    } else {
                        // Continue with de-enrollment using the userId from localStorage
                        return deEnrollWithUserId(eventId, userId);
                    }
                } else {
                    console.log("Server reports user is not logged in");
                    throw new Error("Not logged in");
                }
            })
            .catch(error => {
                console.error("Error during de-enrollment:", error);
                if (error.message === "Not logged in") {
                    alert('Please log in to manage your event enrollments.');
                    window.location.href = 'login.html?redirect=event-details.html?eventId=' + eventId;
                } else {
                    alert('An error occurred while processing your request. Please try again later.');
                }
            });
        } catch (error) {
            console.error("Exception in deEnrollFromEvent:", error);
            alert('An unexpected error occurred. Please try again later.');
        }
    }

    // Helper function to send the actual de-enrollment request
    function deEnrollWithUserId(eventId, userId) {
        // Create request payload
        const payload = {
            eventId: parseInt(eventId, 10),
            userId: parseInt(userId, 10)
        };

        console.log("Sending de-enrollment request with payload:", payload);

        // Send de-enrollment request to server - using DELETE method with the enroll endpoint
        return fetch('/tegel_webapp/events/enroll', {
            method: 'DELETE',  // Changed from POST to DELETE to match the servlet implementation
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload),
            credentials: 'include'
        })
        .then(response => {
            console.log("De-enrollment response received:", response.status);
            return response.json();
        })
        .then(responseData => {
            console.log("Response data:", responseData);
            if (responseData.success) {
                alert('Successfully de-enrolled from the event!');
                loadEventDetails(); // Reload to update participant count
            } else {
                alert(responseData.message || 'Failed to de-enroll from the event.');
            }
            return responseData;
        });
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
        console.log('Event details page loaded');
        loadEventDetails();
    });

    // Add this to your event-details.js file

    function showEnrollmentModal(eventId, hasFoodOption) {
        console.log("Showing enrollment modal for event ID:", eventId, "Has food option:", hasFoodOption);

        // Set event ID in the hidden field
        document.getElementById('modalEventId').value = eventId;

        // Show/hide food option section based on event settings
        const foodSection = document.getElementById('foodOptionSection');
        foodSection.style.display = hasFoodOption ? 'block' : 'none';

        // Reset form
        document.getElementById('wantsFoodOption').checked = false;
        document.getElementById('dietarySection').style.display = 'none';
        document.getElementById('dietaryRestrictions').value = '';
        document.getElementById('specialRequests').value = '';

        // Set up food option checkbox behavior
        document.getElementById('wantsFoodOption').onchange = function() {
            document.getElementById('dietarySection').style.display =
                this.checked ? 'block' : 'none';
        };

        // Show the modal
        const enrollmentModal = new bootstrap.Modal(document.getElementById('enrollmentModal'));
        enrollmentModal.show();

        // Set up the confirmation button
        document.getElementById('confirmEnrollment').onclick = function() {
            submitEnrollment(eventId);
        };
    }

    function submitEnrollment(eventId) {
        const userId = localStorage.getItem('userId');
        const wantsFoodOption = document.getElementById('wantsFoodOption').checked;
        const dietaryRestrictions = document.getElementById('dietaryRestrictions').value;
        const specialRequests = document.getElementById('specialRequests').value;

        const enrollmentData = {
            eventId: parseInt(eventId, 10),
            userId: parseInt(userId, 10),
            wantsFoodOption: wantsFoodOption,
            dietaryRestrictions: dietaryRestrictions || null,
            specialRequests: specialRequests || null
        };

        console.log("Submitting enrollment with data:", enrollmentData);

        fetch('/tegel_webapp/events/enroll', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(enrollmentData),
            credentials: 'include'
        })
            .then(response => response.json())
            .then(data => {
                // Close the modal
                bootstrap.Modal.getInstance(document.getElementById('enrollmentModal')).hide();

                if (data.success) {
                    // Show success message
                    alert('Successfully enrolled in the event!');
                    // Reload event details to update enrollment status
                    loadEventDetails();
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                bootstrap.Modal.getInstance(document.getElementById('enrollmentModal')).hide();
                alert('An error occurred during enrollment. Please try again later.');
            });
    }
</script>
