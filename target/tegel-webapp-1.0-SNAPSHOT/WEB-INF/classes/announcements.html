<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements | Tegel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1 0 auto;
        }
        .announcements-section {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            padding: 40px 30px;
            margin-top: 40px;
        }
        .announcements-section h1 {
            color: #ff8c1a;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .announcements-section p {
            color: #333;
            font-size: 1.2rem;
        }
        @media (max-width: 768px) {
            .announcements-section {
                padding: 20px 10px;
                margin-top: 20px;
            }
            .announcements-section h1 {
                font-size: 2rem;
            }
            .announcements-section p {
                font-size: 1rem;
            }
        }
        .footer {
            background: #000;
            color: white;
            padding: 25px 0;
            margin-top: auto;
        }
        .footer img {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            filter: brightness(0) invert(1);
        }
        .footer a {
            text-decoration: none;
        }
        .social-links {
            display: flex;
            align-items: center;
        }
        .address-text {
            color: #ccc;
            font-size: 14px;
        }
        .footer-brand {
            font-family: 'Courier New', cursive;
            font-size: 24px;
            color: #ff8c1a;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .footer {
                text-align: center;
            }
            .footer .container {
                flex-direction: column !important;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" style="padding:0;">

        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">

</nav>

<main class="container my-4">
    <div class="row justify-content-center mb-4">
        <div class="col-lg-8 col-md-10">
            <form class="row g-2 mb-3" role="search" aria-label="Search announcements">
                <div class="col-12 col-md-8">
                    <input class="form-control" type="search" placeholder="Search announcements..." aria-label="Search announcements">
                </div>
                <div class="col-12 col-md-4">
                    <input class="form-control" type="date" aria-label="Search by date">
                </div>
                <div class="col-12 d-flex justify-content-end">
                    <button class="btn btn-outline-warning mt-2" type="submit">Search</button>
                </div>
            </form>
            <div class="announcements-section">
