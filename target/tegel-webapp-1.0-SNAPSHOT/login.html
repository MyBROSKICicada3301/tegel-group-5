<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Tegel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(255, 181, 107, 0.8), rgba(255, 140, 26, 0.8)), 
                        url('images/5185208.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            margin: 0;
            padding: 0;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .navbar-brand {
            font-family: 'Courier New', cursive;
            font-size: 28px;
            font-weight: bold;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 450px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        .login-card h3 {
            color: #ff8c1a;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .form-control {
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            padding: 15px;
            font-size: 16px;
            margin-bottom: 20px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-control:focus {
            border-color: #ff8c1a;
            box-shadow: 0 0 0 0.2rem rgba(255, 140, 26, 0.25);
        }

        .btn-login {
            background: linear-gradient(45deg, #ff8c1a, #ffb56b);
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            background: linear-gradient(45deg, #e67e22, #ff8c1a);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 140, 26, 0.3);
        }

        .footer {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 25px 0;
            backdrop-filter: blur(10px);
        }

        .footer img {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            filter: brightness(0) invert(1);
        }

        .footer a {
            text-decoration: none;
        }

        .social-links {
            display: flex;
            align-items: center;
        }

        .address-text {
            color: #ccc;
            font-size: 14px;
        }

        .footer-brand {
            font-family: 'Courier New', cursive;
            font-size: 24px;
            color: #ff8c1a;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .login-card {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .login-card h3 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg" style="background: rgba(252,125,4,255); backdrop-filter: blur(10px);">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" style="padding:0;">
            <img src="images/TEGEL LOGO.png" alt="Tegel Logo" style="height:40px; width:auto; display:inline-block; vertical-align:middle;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="events.html">Events</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
            </ul>
            <div>
                <a href="signup.html" class="btn btn-light me-2">Sign Up</a>
                <a href="login.html" class="btn btn-light">Login</a>
            </div>
        </div>
    </div>
</nav>

<main>
    <div class="login-card">
        <h3>Login</h3>
        <form>
            <input class="form-control" type="email" placeholder="Email Address" required>
            <input class="form-control" type="password" placeholder="Password" required>
            <button type="submit" class="btn btn-login w-100">Sign In</button>
        </form>
        <div class="text-center mt-3">
            <p class="text-muted">Don't have an account? <a href="signup.html" style="color: #ff8c1a; text-decoration: none;">Sign up here</a></p>
            <p class="mt-2">
                <a href="forgot-password.html" style="color: #ff8c1a; text-decoration: none;">Forgot Password? Contact Admin</a>
            </p>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
        <div class="social-links">
            <a href="https://www.instagram.com/sgvtegel?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);margin-right:15px;">
            </a>
            <a href="mailto:sgvtegel@gmail.com" target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg" alt="Gmail" style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);">
            </a>
        </div>
        <div class="address-text">Drienerlolaan 5, 7522 NB Enschede</div>
        <img class="footer-brand" src="images/TEGEL LOGO footer.png" alt="Tegel Logo" style="width: 90px; height: auto; filter: none; margin-right: 0;" />
    </div>
</footer>

</body>
</html>
