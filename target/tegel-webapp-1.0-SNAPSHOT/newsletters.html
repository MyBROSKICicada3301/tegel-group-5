<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEGEL Newsletters</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/session-manager.js"></script>
    <style>
        .newsletter-card {
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .newsletter-card:hover {
            transform: translateY(-5px);
        }

        .newsletter-content {
            max-height: 200px;
            overflow: hidden;
            position: relative;
        }

        .content-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: linear-gradient(transparent, white);
        }

        .newsletter-date {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .search-container {
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <div class="logo">
                <img src="images/TEGEL LOGO.png" alt="TEGEL Logo">
            </div>
            <nav id="navBar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="events.html">Events</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="announcements.html">Announcements</a></li>
                    <li><a href="newsletters.html" class="active">Newsletters</a></li>
                    <li id="loginLink"><a href="login.html">Login</a></li>
                    <li id="signupLink"><a href="signup.html">Sign Up</a></li>
                    <li id="accountLink" style="display: none;"><a href="account.html">My Account</a></li>
                    <li id="logoutLink" style="display: none;"><a href="#" onclick="logout()">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container py-5">
        <h1 class="mb-4">TEGEL Newsletters</h1>

        <div class="row">
            <div class="col-md-12 col-lg-10 mx-auto">
                <div class="search-container">
                    <div class="input-group">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search newsletters...">
                        <button class="btn btn-primary" id="searchButton">Search</button>
                    </div>
                </div>

                <div id="newslettersContainer">
                    <!-- Newsletters will be loaded here -->
                    <div class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p>Loading newsletters...</p>
                    </div>
                </div>

                <!-- Admin management button, visible only to admins -->
                <div id="adminControls" class="mt-4 text-center" style="display: none;">
                    <a href="admin-newsletters.html" class="btn btn-primary">Manage Newsletters</a>
                </div>
            </div>
        </div>

        <!-- Newsletter Detail Modal -->
        <div class="modal fade" id="newsletterModal" tabindex="-1" aria-labelledby="newsletterModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="newsletterModalLabel">Newsletter Title</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="newsletterDate" class="mb-3 text-muted"></div>
                        <div id="newsletterContent"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-logo">
                <img src="images/TEGEL LOGO footer.png" alt="TEGEL Logo">
            </div>
            <div class="footer-content">
                <p>&copy; 2025 TEGEL. All rights reserved.</p>
                <p>Contact: info@tegel.org</p>
            </div>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check user session
            checkSession(function(user) {
                if (user) {
                    // Show admin controls if user is admin
                    if (user.admin) {
                        document.getElementById('adminControls').style.display = 'block';
                    }
                }
            });

            // Load newsletters
            loadNewsletters();

            // Setup search
            document.getElementById('searchButton').addEventListener('click', function() {
                const searchTerm = document.getElementById('searchInput').value;
                loadNewsletters(searchTerm);
            });

            // Allow search on Enter key
            document.getElementById('searchInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const searchTerm = document.getElementById('searchInput').value;
                    loadNewsletters(searchTerm);
                }
            });
        });

        // Function to load newsletters
        function loadNewsletters(searchTerm = null) {
            // API URL
            let url = '/api/newsletters?published=true';
            if (searchTerm) {
                url += `&q=${encodeURIComponent(searchTerm)}`;
            }

            // Show loading state
            document.getElementById('newslettersContainer').innerHTML = `
                <div class="text-center">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p>Loading newsletters...</p>
                </div>
            `;

            // Fetch newsletters
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(newsletters => {
                    displayNewsletters(newsletters);
                })
                .catch(error => {
                    console.error('Error loading newsletters:', error);
                    document.getElementById('newslettersContainer').innerHTML = `
                        <div class="alert alert-danger">
                            Error loading newsletters. Please try again later.
                        </div>
                    `;
                });
        }

        // Function to display newsletters
        function displayNewsletters(newsletters) {
            const container = document.getElementById('newslettersContainer');

            if (newsletters.length === 0) {
                container.innerHTML = `
                    <div class="alert alert-info">
                        No newsletters found.
                    </div>
                `;
                return;
            }

            let html = '';

            newsletters.forEach(newsletter => {
                const publishedDate = new Date(newsletter.publishedAt);
                const formattedDate = publishedDate.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                // Create a short preview of the content (first 200 chars)
                const contentPreview = newsletter.content.substring(0, 200) +
                    (newsletter.content.length > 200 ? '...' : '');

                html += `
                    <div class="card newsletter-card">
                        <div class="card-body">
                            <h5 class="card-title">${newsletter.title}</h5>
                            <p class="newsletter-date">Published on ${formattedDate}</p>
                            <div class="newsletter-content">
                                <div>${contentPreview}</div>
                                <div class="content-fade"></div>
                            </div>
                            <button class="btn btn-primary mt-3"
                                    onclick="openNewsletter(${newsletter.id})">
                                Read More
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Function to open newsletter modal
        function openNewsletter(id) {
            // Fetch full newsletter details
            fetch(`/api/newsletters/${id}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(newsletter => {
                    // Format date
                    const publishedDate = new Date(newsletter.publishedAt);
                    const formattedDate = publishedDate.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    // Set modal content
                    document.getElementById('newsletterModalLabel').textContent = newsletter.title;
                    document.getElementById('newsletterDate').textContent = `Published on ${formattedDate}`;
                    document.getElementById('newsletterContent').innerHTML = newsletter.content;

                    // Open modal
                    const modal = new bootstrap.Modal(document.getElementById('newsletterModal'));
                    modal.show();
                })
                .catch(error => {
                    console.error('Error fetching newsletter:', error);
                    alert('Error loading newsletter. Please try again.');
                });
        }

        // Logout function
        function logout() {
            fetch('/api/logout', {
                method: 'POST',
                credentials: 'include'
            })
            .then(response => {
                if (response.ok) {
                    window.location.href = 'index.html';
                }
            });
        }
    </script>
</body>
</html>
