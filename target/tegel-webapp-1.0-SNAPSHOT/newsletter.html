<script>
    function displayNewsletter(newsletter) {
        debug.info("NewsletterDetail", "Displaying newsletter:", newsletter.title);

        // Format date
        let publishDate = 'Date not specified';
        if (newsletter.publishDate) {
            const date = new Date(newsletter.publishDate);
            publishDate = date.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // Populate the newsletter content container
        document.getElementById('newsletterContent').innerHTML = `
            <div class="newsletter-container">
                <h1 class="newsletter-title">${newsletter.title || 'Untitled Newsletter'}</h1>
                <div class="newsletter-date">Published: ${publishDate}</div>
                <div class="newsletter-content">${newsletter.content || 'No content available.'}</div>
            </div>
        `;

        // Update page title with newsletter title
        document.title = `${newsletter.title || 'Newsletter'} | Tegel`;
        debug.info("NewsletterDetail", "Newsletter display complete");
    }

    document.addEventListener('DOMContentLoaded', function() {
        // First, check if debug utility exists, if not create it
        if (typeof debug === 'undefined') {
            window.debug = {
                log: function(source, message, data) {
                    console.log(`[${source}] ${message}`, data || '');
                },
                error: function(source, message, error) {
                    console.error(`[${source}] ERROR: ${message}`, error || '');
                },
                warn: function(source, message, data) {
                    console.warn(`[${source}] WARNING: ${message}`, data || '');
                },
                info: function(source, message, data) {
                    console.info(`[${source}] INFO: ${message}`, data || '');
                }
            };
        }

        // Get newsletter ID from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const newsletterId = urlParams.get('id');

        debug.info("NewsletterDetail", `Initializing newsletter view for ID: ${newsletterId || 'not provided'}`);

        if (!newsletterId) {
            // No newsletter ID provided, show error
            debug.error("NewsletterDetail", "No newsletter ID provided in URL");
            document.getElementById('newsletterContent').innerHTML = `
                <div class="error">
                    <h3>Error</h3>
                    <p>No newsletter ID provided. Please select a newsletter from the home page.</p>
                    <a href="index.html" class="btn btn-primary">Go to Home</a>
                </div>
            `;
            return;
        }

        // Construct the API URL using the base URL and context path
        const baseUrl = window.location.origin;
        const fullPath = window.location.pathname;
        const pathParts = fullPath.split('/');
        const contextPath = '/' + (pathParts[1] || '');

        debug.info("NewsletterDetail", `Current context path: ${contextPath}`);

        // Use the context path in the API URL
        const apiUrl = `${baseUrl}${contextPath}/newsletters/${newsletterId}`;
        debug.info("NewsletterDetail", `Fetching newsletter with URL: ${apiUrl}`);

        // Fetch the newsletter data
        fetch(apiUrl)
            .then(response => {
                debug.info("NewsletterDetail", `Response received with status: ${response.status} ${response.statusText}`);

                // Debug response headers
                let headers = {};
                response.headers.forEach((value, name) => {
                    headers[name] = value;
                });
                debug.info("NewsletterDetail", "Response headers:", headers);

                if (!response.ok) {
                    throw new Error(`Newsletter not found (Status ${response.status})`);
                }
                return response.json();
            })
            .then(newsletter => {
                debug.info("NewsletterDetail", "Newsletter data received:", newsletter);
                displayNewsletter(newsletter);
            })
            .catch(error => {
                debug.error("NewsletterDetail", "Error loading newsletter:", error);

                // Additional error diagnostics
                if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
                    debug.error("NewsletterDetail", "Network error - server might be down or CORS issue");
                }

                document.getElementById('newsletterContent').innerHTML = `
                    <div class="error">
                        <h3>Error Loading Newsletter</h3>
                        <p>Could not load the newsletter. It might not exist or there was a server error.</p>
                        <p>Technical details: ${error.message}</p>
                        <a href="index.html" class="btn btn-primary">Go to Home</a>
                    </div>
                `;
            });
    });
</script>
