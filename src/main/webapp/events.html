<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | Tegel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            background: #ffb56b;
        }

        main {
            flex: 1;
        }

        .navbar-brand {
            font-family: 'Courier New', cursive;
            font-size: 24px;
        }

        .event-tile {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            overflow: hidden;
        }

        .event-tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .event-tile .card-body {
            padding: 25px;
        }

        .event-title {
            color: #ff8c1a;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .event-description {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .event-duration {
            color: #333;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 8px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            display: inline-block;
        }

        .btn-select {
            background: linear-gradient(45deg, #ff8c1a, #ffb56b);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn-select:hover {
            background: linear-gradient(45deg, #e67e22, #ff8c1a);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 140, 26, 0.3);
            color: white;
        }

        .footer {
            background: #000;
            color: white;
            padding: 20px;
        }

        .footer img {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }

        .social-links {
            display: flex;
            align-items: center;
        }

        .address-text {
            color: #ccc;
            font-size: 14px;
        }

        .footer-brand {
            font-family: 'Courier New', cursive;
            font-size: 24px;
            color: #ff8c1a;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Admin-only event creation form -->
    <!-- Modal for creating events -->
    <div class="modal fade" id="createEventModal" tabindex="-1" aria-labelledby="createEventModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="createEventModalLabel">Create New Event</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="adminEventCreateForm">
                        <div class="mb-3">
                            <label for="eventTitle" class="form-label">Title</label>
                            <input type="text" class="form-control" id="eventTitle" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="eventDescription" name="description" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="eventDate" class="form-label">Date</label>
                            <input type="date" class="form-control" id="eventDate" name="date" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventTime" class="form-label">Time</label>
                            <input type="time" class="form-control" id="eventTime" name="time" required>
                        </div>
                        <div class="mb-3">
                            <label for="eventLocation" class="form-label">Location</label>
                            <input type="text" class="form-control" id="eventLocation" name="location" value="Tegel Community Center" required>
                        </div>
                        <div class="mb-3">
                            <label for="maxParticipants" class="form-label">Maximum Participants</label>
                            <input type="number" class="form-control" id="maxParticipants" name="maxParticipants" value="50" required>
                        </div>
                        <div id="adminEventCreateMsg" class="mt-2"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="submitEventBtn">Create Event</button>
                </div>
            </div>
        </div>
    </div>

<nav class="navbar navbar-expand-lg" style="background: rgba(252,125,4,255);">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" style="padding:0;">
            <img src="images/TEGEL LOGO.png" alt="Tegel Logo" style="height:40px; width:auto; display:inline-block; vertical-align:middle;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="events.html">Events</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="announcements.html">Announcements</a></li>
            </ul>
            <div id="authButtons">
                <a href="signup.html" class="btn btn-light me-2">Sign Up</a>

            </div>
        </div>
    </div>
</nav>

<!-- Admin-only create event button -->
<div class="admin-only container my-3" style="display:none">
    <button id="showCreateEventFormBtn" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createEventModal">Create Event</button>
</div>

<main class="container my-4">
    <div class="mb-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div class="input-group">
                    <input type="text" class="form-control" id="eventSearchInput" placeholder="Search events by name, location...">
                    <button class="btn btn-primary" type="button" onclick="searchEvents()">Search</button>
                    <button class="btn btn-secondary" type="button" onclick="resetEventSearch()">Reset</button>
                </div>
            </div>
        </div>
    </div>
    <div class="row g-4" id="eventsContainer">
        <!-- Events will be loaded here -->
    </div>
</main>

<script>
    // Dummy events for testing
    const dummyEvents = [
        {
            eventId: 1,
            id: 1,
            title: "Group Game",
            description: "Join us for an exciting evening of team-building games and friendly competition. We'll have board games, video games, and interactive group activities that will bring everyone together for a fun-filled experience.",
            date: "2025-01-15",
            location: "Tegel Community Center",
            maxParticipants: 25,
            currentParticipants: 8,
            duration: "18:00 - 22:00"
        },
        {
            eventId: 2,
            id: 2,
            title: "Outdoor Trek",
            description: "Experience the beautiful nature around Enschede with a guided hiking adventure. We'll explore scenic trails, enjoy fresh air, and capture amazing photos while building lasting memories with fellow Tegel members.",
            date: "2025-01-22",
            location: "Lonnekerberg Trail, Enschede",
            maxParticipants: 15,
            currentParticipants: 12,
            duration: "09:00 - 16:00"
        },
        {
            eventId: 3,
            id: 3,
            title: "Module Ending Party",
            description: "Celebrate the successful completion of another academic module with an unforgettable party! Dancing, great food, drinks, and the perfect opportunity to unwind and socialize with friends after all the hard work.",
            date: "2025-02-05",
            location: "Inter-Actief Main Hall",
            maxParticipants: 50,
            currentParticipants: 23,
            duration: "20:00 - 02:00"
        }
    ];

    function loadEvents() {
        console.log('Loading events...');
        fetch('/tegel_webapp/events')
            .then(response => {
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                return response.text(); // Get response as text first for debugging
            })
            .then(text => {
                console.log('Raw response:', text);
                try {
                    const events = JSON.parse(text);
                    console.log('Parsed events:', events);
                    if (!Array.isArray(events)) {
                        console.error('Events is not an array:', events);
                        throw new Error('Expected array of events');
                    }
                    displayEvents(events);
                } catch (e) {
                    console.error('JSON parse error:', e);
                    displayEvents(dummyEvents);
                }
            })
            .catch(error => {
                console.error('Error loading events from server, using dummy data:', error);
                // Use dummy data as fallback
                displayEvents(dummyEvents);
            });
    }

    function displayEvents(events) {
        const container = document.getElementById('eventsContainer');
        container.innerHTML = '';
        
        if (events.length === 0) {
            container.innerHTML = '<div class="col-12"><p class="text-center">No events available.</p></div>';
            return;
        }
        
        events.forEach(event => {
            const eventCard = document.createElement('div');
            eventCard.className = 'col-lg-4 col-md-6';
            
            // Calculate duration or use provided duration
            let duration = 'Duration not specified';
            if (event.startTime && event.endTime) {
                duration = `${event.startTime} - ${event.endTime}`;
            } else if (event.duration) {
                duration = event.duration;
            }
            
            // Format date for display
            let displayDate = event.date;
            if (event.date) {
                const eventDate = new Date(event.date);
                displayDate = eventDate.toLocaleDateString('en-US', { 
                    weekday: 'short', 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
            }
            
            eventCard.innerHTML = `
                <div class="card event-tile h-100">
                    <div class="card-body d-flex flex-column">
                        <h5 class="event-title">${event.title}</h5>
                        <p class="event-description">${event.description || 'No description available.'}</p>
                        <div class="event-duration mb-3">
                            <i class="bi bi-clock"></i> ${duration}
                        </div>
                        <div class="event-date mb-3" style="color: #ff8c1a; font-weight: bold;">
                            📅 ${displayDate}
                        </div>
                        <div class="event-location mb-3" style="color: #666; font-size: 14px;">
                            📍 ${event.location || 'Location TBA'}
                        </div>
                        <div class="event-participants mb-3" style="color: #333; font-size: 14px;">
                            👥 ${event.currentParticipants || 0}/${event.maxParticipants || '∞'} enrolled
                        </div>
                        <div class="mt-auto">
                            <button class="btn btn-select" onclick="selectEvent(${event.id || event.eventId})">
                                Select
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(eventCard);
        });
    }

    function selectEvent(eventId) {
        // Redirect to event details page with event ID as parameter
        window.location.href = `event-details.html?eventId=${eventId}`;
    }

    function searchEvents() {
        const query = document.getElementById('eventSearchInput').value.toLowerCase();
        const filteredEvents = dummyEvents.filter(event => {
            return event.title.toLowerCase().includes(query) ||
                   event.location.toLowerCase().includes(query) ||
                   (event.description && event.description.toLowerCase().includes(query));
        });
        displayEvents(filteredEvents);
    }

    function resetEventSearch() {
        document.getElementById('eventSearchInput').value = '';
        displayEvents(dummyEvents);
    }

    document.addEventListener('DOMContentLoaded', loadEvents);

    // Admin event creation functionality
    document.addEventListener('DOMContentLoaded', function() {
        // Handle event creation form submission via the submit button in modal
        const submitEventBtn = document.getElementById('submitEventBtn');
        if (submitEventBtn) {
            submitEventBtn.addEventListener('click', function() {
                const title = document.getElementById('eventTitle').value;
                const description = document.getElementById('eventDescription').value;
                const date = document.getElementById('eventDate').value;
                const time = document.getElementById('eventTime').value;
                const location = document.getElementById('eventLocation').value;
                const maxParticipants = document.getElementById('maxParticipants').value;

                // Form validation
                const form = document.getElementById('adminEventCreateForm');
                if (!form.checkValidity()) {
                    // Trigger browser's native validation UI
                    form.reportValidity();
                    return;
                }

                const eventData = {
                    title: title,
                    description: description,
                    date: date,
                    startTime: time,
                    maxParticipants: parseInt(maxParticipants),
                    location: location
                };

                debug.log('EventCreation', 'Creating event with data:', eventData);

                // Send the request to create the event
                fetch('/tegel_webapp/events', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(eventData)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to create event');
                    }
                    return response.json();
                })
                .then(data => {
                    debug.log('EventCreation', 'Event created successfully:', data);

                    // Show success message
                    const msgElement = document.getElementById('adminEventCreateMsg');
                    msgElement.className = 'alert alert-success';
                    msgElement.textContent = 'Event created successfully!';

                    // Reset the form
                    document.getElementById('adminEventCreateForm').reset();

                    // Reload events to show the new event
                    loadEvents();

                    // Close the modal after a short delay
                    setTimeout(() => {
                        // Hide the modal
                        const modal = bootstrap.Modal.getInstance(document.getElementById('createEventModal'));
                        modal.hide();

                        // Clear the message after closing
                        msgElement.textContent = '';
                        msgElement.className = '';
                    }, 1500);
                })
                .catch(error => {
                    debug.error('EventCreation', 'Error creating event:', error);

                    // Show error message
                    const msgElement = document.getElementById('adminEventCreateMsg');
                    msgElement.className = 'alert alert-danger';
                    msgElement.textContent = 'Failed to create event: ' + error.message;
                });
            });
        }

        // Reset the form and error messages when the modal is closed
        const createEventModal = document.getElementById('createEventModal');
        if (createEventModal) {
            createEventModal.addEventListener('hidden.bs.modal', function() {
                const form = document.getElementById('adminEventCreateForm');
                if (form) form.reset();

                const msgElement = document.getElementById('adminEventCreateMsg');
                if (msgElement) {
                    msgElement.textContent = '';
                    msgElement.className = '';
                }
            });
        }
    });
</script>
