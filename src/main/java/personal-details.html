<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Details | Tegel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ffb56b 0%, #ff8c1a 100%);
            margin: 0;
            padding: 0;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .navbar-brand {
            font-family: 'Courier New', cursive;
            font-size: 28px;
            font-weight: bold;
        }

        .details-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 800px;
            width: 100%;
        }

        .details-card h2 {
            color: #333;
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .form-control {
            border-radius: 8px;
            border: 2px solid #ddd;
            padding: 12px 15px;
            font-size: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: white;
        }

        .form-control:focus {
            border-color: #ff8c1a;
            box-shadow: 0 0 0 0.2rem rgba(255, 140, 26, 0.25);
            outline: none;
        }

        .form-control::placeholder {
            color: #999;
            font-style: italic;
        }

        .dietary-section {
            grid-column: 1 / -1;
        }

        .dietary-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn-submit {
            background: linear-gradient(45deg, #ff8c1a, #ffb56b);
            border: none;
            border-radius: 12px;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin: 30px auto 0;
            min-width: 200px;
        }

        .btn-submit:hover {
            background: linear-gradient(45deg, #e67e22, #ff8c1a);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 140, 26, 0.3);
        }

        .footer {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 25px 0;
            backdrop-filter: blur(10px);
        }

        .footer img {
            width: 28px;
            height: 28px;
            margin-right: 15px;
            filter: brightness(0) invert(1);
        }

        .footer a {
            text-decoration: none;
        }

        .social-links {
            display: flex;
            align-items: center;
        }

        .address-text {
            color: #ccc;
            font-size: 14px;
        }

        .footer-brand {
            font-family: 'Courier New', cursive;
            font-size: 24px;
            color: #ff8c1a;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .details-card {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .details-card h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg" style="background: rgba(252,125,4,255); backdrop-filter: blur(10px);">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" style="padding:0;">
            <img src="images/TEGEL LOGO.png" alt="Tegel Logo" style="height:40px; width:auto; display:inline-block; vertical-align:middle;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="events.html">Events</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="about.html">About</a></li>
            </ul>
            <div>
                <a href="#" class="btn btn-light me-2">Admin</a>
                <a href="login.html" class="btn btn-light">Logout</a>
            </div>
        </div>
    </div>
</nav>

<main>
    <div class="details-card">
        <h2>Enter Personal Details</h2>
        <form id="personalDetailsForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" class="form-control" placeholder="Name" required>
                </div>
                <div class="form-group dietary-section">
                    <label for="dietary">Dietary Restrictions (if any):</label>
                    <textarea id="dietary" class="form-control dietary-textarea" 
                              placeholder="Dietary restrictions" rows="4"></textarea>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" class="form-control" placeholder="E-mail" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone no.:</label>
                    <input type="tel" id="phone" class="form-control" placeholder="Phone no." required>
                </div>
            </div>
            
            <button type="submit" class="btn-submit">Submit</button>
        </form>
    </div>
</main>

<footer class="footer">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
        <div class="social-links">
            <a href="https://www.instagram.com/sgvtegel?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);margin-right:15px;">
            </a>
            <a href="mailto:sgvtegel@gmail.com" target="_blank" rel="noopener">
                <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg" alt="Gmail" style="width:28px;height:28px;filter:invert(41%) sepia(77%) saturate(7492%) hue-rotate(326deg) brightness(99%) contrast(101%);">
            </a>
        </div>
        <div class="address-text">Drienerlolaan 5, 7522 NB Enschede</div>
        <img class="footer-brand" src="images/TEGEL LOGO footer.png" alt="Tegel Logo" style="width: 90px; height: auto; filter: none; margin-right: 0;" />
    </div>
</footer>

<script>
    document.getElementById('personalDetailsForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Collect form data
        const formData = {
            name: document.getElementById('name').value,
            dob: document.getElementById('dob').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            dietary: document.getElementById('dietary').value
        };
        
        // Here you would typically send the data to your server
        console.log('Form submitted:', formData);
        
        // Show success message or redirect
        alert('Personal details submitted successfully!');
        
        // Redirect to dashboard or home page
        window.location.href = 'index.html';
    });
</script>

</body>
</html>
